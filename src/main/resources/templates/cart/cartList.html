<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/basic.html}">

<!-- 사용자 스크립트 추가 -->
<th:block layout:fragment="script">
  <script th:inline="javascript">
    $(document).ready(function(){
      $("input[name=cartChkBox]").change(function(){
        getOrderTotalPrice();
      });
    });

    function getOrderTotalPrice(){
      var orderTotalPrice = 0;
      $("input[name=cartChkBox]:checked").each(function() {
        var mid = $(this).val();
        var price = $("#price_" + mid).attr("data-price");
        var count = $("#count_" + mid).val();
        orderTotalPrice += price * count;
      });
      $("#orderTotalPrice").html(orderTotalPrice + '원');
    }

    function changeCount(obj){
      var count = obj.value;
      var mid = obj.id.split('_')[1];
      var price = $("#price_" + mid).data("price");
      var totalPrice = count * price;
      $("#totalPrice_" + mid).html(totalPrice + "원");
      getOrderTotalPrice();
      updateCartItemCount(mid, count);
    }

    function checkAll(){
      $("input[name=cartChkBox]").prop("checked", $("#checkall").prop("checked"));
      getOrderTotalPrice();
    }

    function updateCartItemCount(mid, count){
      var url = "/cartItem/" + mid + "?count=" + count;
      $.ajax({
        url: url,
        type: "PATCH",
        dataType: "json",
        cache: false,
        success: function(){
          console.log("cartItem count update success");
        },
        error: function(jqXHR){
          if (jqXHR.status == '401') {
            alert('로그인 후 이용해주세요');
            location.href = '/member/login';
          } else {
            alert(jqXHR.responseJSON.message);
          }
        }
      });
    }

    function deleteCartItem(obj){
      var mid = obj.dataset.id;
      var url = "/cartItem/" + mid;
      $.ajax({
        url: url,
        type: "DELETE",
        dataType: "json",
        cache: false,
        success: function(){
          location.href = '/cart';
        },
        error: function(jqXHR){
          if (jqXHR.status == '401') {
            alert('로그인 후 이용해주세요');
            location.href = '/member/login';
          } else {
            alert(jqXHR.responseJSON.message);
          }
        }
      });
    }

    function orders(){
      var url = "/cart/orders";
      var dataList = [];

      $("input[name=cartChkBox]:checked").each(function() {
        var mid = $(this).val();
        dataList.push({ mid: mid });
      });

      var param = JSON.stringify({ cartOrderDTOList: dataList });

      $.ajax({
        url: url,
        type: "POST",
        contentType: "application/json",
        data: param,
        dataType: "json",
        cache: false,
        success: function(){
          alert("주문이 완료 되었습니다.");
          location.href = '/orders';
        },
        error: function(jqXHR){
          if (jqXHR.status == '401') {
            alert('로그인 후 이용해주세요');
            location.href = '/member/login';
          } else {
            alert(jqXHR.responseJSON.message);
          }
        }
      });
    }
  </script>
</th:block>

<!-- 사용자 CSS 추가 -->
<th:block layout:fragment="css">
  <style>
    .content-mg {
      margin-left: 25%;
      margin-right: 25%;
      margin-top: 2%;
      margin-bottom: 100px;
    }
    .repImgDiv {
      margin: 0 15px;
      height: auto;
    }
    .repImg {
      height: 100px;
      width: 100px;
    }
    .fs18 {
      font-size: 18px;
    }
    .fs24 {
      font-size: 24px;
    }
  </style>
</th:block>

<div layout:fragment="content" class="content-mg">

  <h2 class="mb-4">장바구니 목록</h2>

  <div>
    <table class="table">
      <colgroup>
        <col width="15%"/>
        <col width="70%"/>
        <col width="15%"/>
      </colgroup>
      <thead>
      <tr class="text-center">
        <td><input type="checkbox" id="checkall" onclick="checkAll()"> 전체선택</td>
        <td>상품정보</td>
        <td>상품금액</td>
      </tr>
      </thead>
      <tbody>
      <tr th:each="cartItem : ${cartItem}">
        <td class="text-center align-middle">
          <input type="checkbox" name="cartChkBox" th:value="${cartItem.mid}">
        </td>
        <td class="d-flex">
          <div class="repImgDiv align-self-center">
            <img th:src="${cartItem.imgUrl}" class="rounded repImg" th:alt="${cartItem.itemNm}">
          </div>
          <div class="align-self-center">
            <span th:text="${cartItem.itemNm}" class="fs24 font-weight-bold"></span>
            <div class="fs18 font-weight-light">
        <span class="input-group mt-2">
          <span th:id="'price_' + ${cartItem.mid}"
                th:data-price="${cartItem.price}"
                th:text="${cartItem.price} + '원'" class="align-self-center mr-2"></span>
          <input type="number" name="count" th:id="'count_' + ${cartItem.mid}"
                 th:value="${cartItem.count}" min="1"
                 onchange="changeCount(this)" class="form-control mr-2" >
          <button type="button" class="close" aria-label="Close">
            <span aria-hidden="true" th:data-id="${cartItem.mid}" onclick="deleteCartItem(this)">&times;</span>
          </button>
        </span>
            </div>
          </div>
        </td>
        <td class="text-center align-middle">
    <span th:id="'totalPrice_' + ${cartItem.mid}"
          name="totalPrice"
          th:text="${cartItem.price * cartItem.count} + '원'"></span>
        </td>
      </tr>

      </tbody>

    </table>

    <h2 class="text-center">
      총 주문 금액 : <span id="orderTotalPrice" class="text-danger">0원</span>
    </h2>

    <div class="text-center mt-3">
      <button type="button" class="btn btn-primary btn-lg" onclick="orders()">주문하기</button>
    </div>
  </div>

</div>

</html>
