<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">  <!--타입리프와 레이아웃용 코드 필수 -->

<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Simple Sidebar - Start Bootstrap Template</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>
<body>
<div class="d-flex" id="wrapper">
    <!-- Sidebar-->
    <div class="border-end bg-white" id="sidebar-wrapper">
        <div class="sidebar-heading border-bottom bg-light">MONETTE</div>
        <div class="list-group list-group-flush">
            <a class="list-group-item list-group-item-action list-group-item-light p-3" href="/">SHOP</a>
            <a class="list-group-item list-group-item-action list-group-item-light p-3" href="/board/list">MEMBER</a>

            <div class="nav-item dropdown">
                <a class="list-group-item list-group-item-action list-group-item-light p-3 dropdown-toggle" href="#" id="masterDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    MASTER
                </a>
                <ul class="dropdown-menu" aria-labelledby="masterDropdown">
                    <li><a class="dropdown-item" href="/admin/item/new">상품 등록</a></li>
                    <li><a class="dropdown-item" href="/admin/items">상품관리</a></li>
                </ul>
            </div>
        </div>
    </div>
    <!-- Page content wrapper-->
    <div id="page-content-wrapper" style="padding-left: 20px; padding-right: 20px;">
        <!-- Top navigation-->
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-4">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                        <!--<li class="nav-item active"><a class="nav-link" href="/">HOME</a></li>-->
                        <li class="nav-item"><a class="nav-link" href="/member/join">JOIN</a></li>
                        <li class="nav-item"><a class="nav-link" href="/member/login">LOGIN</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logout">LOGOUT</a></li>

                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" id="navbarDropdown1" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">MY</a>
                            <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <a class="dropdown-item" href="/member/modify">EDIT</a>
                                <a class="dropdown-item" href="#!">DELETE ACCOUNT</a>
                            </div>
                        </li>

                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" id="navbarDropdown2" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">CART</a>
                            <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <a class="dropdown-item" href="/cart">CART LIST</a>
                                <a class="dropdown-item" href="/orders">ORDER LIST</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- Page content-->
        <div class="container-fluid" layout:fragment="content">

        </div>
    </div>
</div>
<!-- Bootstrap core JS-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
<th:block layout:fragment="script">
    <!--자바 스크립트 영역-->
</th:block>
</body>
</html>
