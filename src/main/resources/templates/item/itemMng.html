<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/basic.html}">

<head>
    <title>상품 관리</title>
</head>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        $(document).ready(function(){
            $("#searchBtn").on("click",function(e) {
                e.preventDefault();
                page(0);
            });
        });

        function page(page){
            var searchDateType = $("#searchDateType").val();
            var searchSellStatus = $("#searchSellStatus").val();
            var searchBy = $("#searchBy").val();
            var searchQuery = $("#searchQuery").val();

            location.href = "/admin/items/" + page + "?searchDateType=" + searchDateType
                + "&searchSellStatus=" + searchSellStatus
                + "&searchBy=" + searchBy
                + "&searchQuery=" + searchQuery;
        }
    </script>
</th:block>

<body>
<div layout:fragment="content">

    <form th:action="@{'/admin/items/' + ${items.number}}" method="get">

        <!-- 상품 테이블 -->
        <table class="table">
            <thead>
            <tr>
                <th>상품아이디</th>
                <th>상품명</th>
                <th>상태</th>
                <th>등록자</th>
                <th>등록일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items.content}">
                <td th:text="${item.mid}"></td>
                <td>
                    <a th:href="@{'/admin/item/' + ${item.mid}}" th:text="${item.itemNm}"></a>
                </td>
                <td th:text="${item.itemSellStatus == T(org.mbc.board.constant.ItemSellStatus).SELL ? '판매중' : '품절'}"></td>
                <td th:text="${item.createdBy}"></td>
                <td th:text="${#temporals.format(item.regTime, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>

        <!-- 페이지네이션 -->
        <div th:with="start=${(items.number / maxPage) * maxPage + 1},
                      end=${items.totalPages == 0 ? 1 : ((start + maxPage - 1) < items.totalPages ? (start + maxPage - 1) : items.totalPages)}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${items.first} ? 'disabled'">
                    <a th:onclick="'javascript:page(' + ${items.number - 1} + ')'" class="page-link" aria-label="Previous">
                        <span aria-hidden="true">Previous</span>
                    </a>
                </li>

                <li class="page-item"
                    th:each="page : ${#numbers.sequence(start, end)}"
                    th:classappend="${items.number == page - 1} ? 'active'">
                    <a th:onclick="'javascript:page(' + ${page - 1} + ')'" class="page-link" th:inline="text">[[${page}]]</a>
                </li>

                <li class="page-item" th:classappend="${items.last} ? 'disabled'">
                    <a th:onclick="'javascript:page(' + ${items.number + 1} + ')'" class="page-link" aria-label="Next">
                        <span aria-hidden="true">Next</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- 검색 폼 -->
        <div class="form-inline justify-content-center" th:object="${itemSearchDTO}">
            <select th:field="*{searchDateType}" class="form-control mx-1" id="searchDateType">
                <option value="all">전체기간</option>
                <option value="1d">1일</option>
                <option value="1w">1주</option>
                <option value="1m">1개월</option>
                <option value="6m">6개월</option>
            </select>

            <select th:field="*{searchSellStatus}" class="form-control mx-1" id="searchSellStatus">
                <option value="">판매상태(전체)</option>
                <option value="SELL">판매</option>
                <option value="SOLD_OUT">품절</option>
            </select>

            <select th:field="*{searchBy}" class="form-control mx-1" id="searchBy">
                <option value="itemNm">상품명</option>
                <option value="createdBy">등록자</option>
            </select>

            <input th:field="*{searchQuery}" id="searchQuery" type="text" class="form-control mx-1" placeholder="검색어 입력">

            <button id="searchBtn" type="submit" class="btn btn-primary mx-1">검색</button>
        </div>

    </form>
</div>
</body>
</html>
