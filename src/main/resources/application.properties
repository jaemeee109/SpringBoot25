## 톰캣 관련 설정 및 데이터베이스 관련 설정
spring.application.name=board
## 스프링 애플리케이션 이름

server.port=8000
## 서버 포트 설정 (기본 8080 → 80으로 변경)

## 로그 출력 설정
logging.level.org.springframework=info
## 스프링 프레임워크 로그 레벨
logging.level.org.mbc=debug
## 사용자 패키지(org.mbc) 로그 레벨

## 데이터베이스 1,2단계 설정
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/bootex
spring.datasource.username=bootuser
spring.datasource.password=bootuser

## JPA 관련 설정 추가
spring.jpa.hibernate.ddl-auto=update
# ddl-auto 옵션 설명:
# update       : 테이블 구조 변경 시 drop 후 create (데이터 유지)
# none         : 구조 변경 안 함
# create       : 애플리케이션 실행 시마다 테이블 새로 생성 (기존 삭제됨)
# create-drop  : 실행 시 생성, 종료 시 삭제
# validate     : 테이블 변경 사항만 검사 (구조 변경 안 함)

spring.jpa.properties.hibernate.format_sql=true
## 콘솔에 SQL 쿼리를 보기 좋게 출력
spring.jpa.show-sql=true
## 실행된 SQL 쿼리 콘솔 출력

## MariaDB에서 실행할 수 있는 SQL 예시 (데이터베이스 및 사용자 생성)
# CREATE DATABASE `bootex` /*!40100 COLLATE 'utf8_general_ci' */;
# SHOW DATABASES;
# CREATE USER 'bootuser'@'%' IDENTIFIED BY 'bootuser';
# GRANT USAGE ON *.* TO 'bootuser'@'%';
# GRANT EXECUTE, SELECT, SHOW VIEW, ALTER, ALTER ROUTINE, CREATE, CREATE ROUTINE,
#       CREATE TEMPORARY TABLES, CREATE VIEW, DELETE, DROP, EVENT, INDEX, INSERT,
#       REFERENCES, TRIGGER, UPDATE, LOCK TABLES
#       ON `bootex`.* TO 'bootuser'@'%' WITH GRANT OPTION;
# FLUSH PRIVILEGES;

## 첨부파일 관리용 설정 (책 p597 참고)
spring.servlet.multipart.enabled=true
## 파일 업로드 기능 활성화
spring.servlet.multipart.location=c:\\upload\\
## 파일 저장 경로 (Windows 기준)
spring.servlet.multipart.max-file-size=10MB
## 업로드 가능한 개별 파일 최대 크기
spring.servlet.multipart.max-request-size=30MB
## 전체 요청에서 허용하는 최대 크기
org.mbc.upload.path=c:\\upload
## Java 코드에서 참조할 업로드 경로
##경로 변경 시 반드시 여기도 함께 수정해야 함

##스프링 시큐리티 부분 추가 설정 (p.681)
logging.level.org.springframework.security=trace
## 로그분석
## DisableEncodeUrlFilter (1/10)
## : 세션 ID가 URL에 포함되는 것을 막기 위해 HttpServletResponse를 사용해서 URL이 인코딩 되는 것을 막기위한 필터이다

## WebAsyncManagerIntegrationFilter (2/10)
## : SpringSecurityContextHolder는 기본적으로 ThreadLocal 기반으로 동작하는데
## , 비동기와 관련된 기능을 쓸 때에도 SecurityContext를 사용할 수 있도록 만들어주는 필터이다

## SecurityContextHolderFilter (3/10)
## : SecurityContext가 없으면 만들어주는 필터이다
## securityContext는 Authentication 객체를 보관하는 인터페이스이다
## SecurityContext를 통해 한 요청에 대해서 어떤 필터에서도 같은 Authentication객체를 사용할 수 있다

## HeaderWriterFilter (4/10)
## : 응답헤더에 Security와 관련된 헤더 값을 설정해주는 필터이다

## CsrfFilter (5/10)
## : CSRF 공격을 방어하기 위한 설정을 하는 필터이다
## CSRF (Cross-Site Request Forgery, 크로스 사이트 요청 위조)는 웹 보안 취약점 중 하나로,
## 사용자가 자신의 의지와는 무관하게 공격자가 의도한 요청을 특정 웹사이트에 보내도록 유도하는 공격입니다
## 즉, 공격자가 악성 코드를 심은 웹페이지나 이메일 등을 통해 사용자가 로그인 된 상태에서 원하지않는 작업을 수행하도록 속이는 것입니다

## LogoutFilter (6/10)
## : 로그아웃 요청을 처리하는 필터이다. 아래에 DefaultLogoutPageGeneratingFilter가 로그아웃 기본 페이지를 생성한다
## Did not match request to Ant [pattern='/lougout', Post]

## Invoking RequestCacheAwareFilter (7/10)
## : 인증 처리 후 원래의 Request 정보로 재구성하는 필터이다

## Invoking SecurityContextHolderAwareRequestFilter (8/10)
## : 서블릿 API 보안 메서드를 구현하는 요청 래퍼로 서블릿 요청을 채우는 필터이다

## AnonymousAuthenticationFilter (9/10)
## : 이 필터에 올 때까지 사용자가 인증되지 않았다면, 이 요청은 익명의 사용자가 보낸 것으로 판단할 수 있다
## 이 익명 사용자에 관한 처리를 하는 필터이다

## ExceptionTranslationFilter (10/10)
## : 필터 처리 과정에서 인증 예외 또는 인가 예외가 발생한 경우 해당 예외를 잡아서 처리하는 필터이다
